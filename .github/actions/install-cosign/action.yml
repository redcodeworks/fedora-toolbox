name: Install cosign
description: Installs the cosign version this repo signs and verifies with (one place to bump it)
runs:
  using: composite
  steps:
    - name: Install Cosign
      uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      with:
        # be careful when upgrading major versions
        cosign-release: 'v3.1.4'
