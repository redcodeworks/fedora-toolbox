---
name: Build container image
on:
  pull_request:
    branches:
      - main
  schedule:
    - cron: '0 6 * * 0'  # weekly, Sunday 06:00 UTC (the only schedule)
  push:
    branches:
      - main
    paths-ignore:
      - '**/README.md'
  workflow_dispatch:

env:
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"  # do not edit
  IMAGE_NAME: fedora-toolbox

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build_push:
    name: Build, smoke-test, push and sign
    runs-on: ubuntu-26.04

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      # These action versions are pinned by https://github.com/renovatebot/renovate
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 #v4.0.0

      - name: Lint
        run: |
          just check
          just lint

      - name: Prepare environment
        run: |
          # Lowercase the image uri https://github.com/macbre/push-to-ghcr/issues/12
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> "${GITHUB_ENV}"
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >> "${GITHUB_ENV}"
          echo "DATED_TAG=latest-$(date -u +%Y%m%d)-${GITHUB_SHA::7}" >> "${GITHUB_ENV}"

      # A failed dnf resolution (missing or renamed package) fails here, loudly.
      - name: Build image
        run: |
          podman build --pull=newer -f Containerfile \
            -t "localhost/${IMAGE_NAME}:latest" \
            -t "localhost/${IMAGE_NAME}:${DATED_TAG}" .

      - name: Smoke test
        run: just smoke "${IMAGE_NAME}" latest

      # Pull requests (and any non-default branch) stop after the smoke test:
      # nothing is published under this account without a merge to main.
      - name: Login to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push To GHCR
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        id: push-image
        run: |
          set -euox pipefail
          for tag in latest "${DATED_TAG}"; do
            podman push --digestfile="${RUNNER_TEMP}/digestfile" \
              "localhost/${IMAGE_NAME}:${tag}" "${IMAGE_REGISTRY}/${IMAGE_NAME}:${tag}"
          done
          echo "digest=$(< "${RUNNER_TEMP}/digestfile")" >> "$GITHUB_OUTPUT"

      # The private key is the repository secret SIGNING_SECRET (cosign.key contents);
      # the public key cosign.pub is committed. Both tags point at the same digest,
      # so signing the digest covers both.
      - name: Install Cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        with:
          # be careful when upgrading major versions
          cosign-release: 'v3.1.4'

      - name: Sign container image
        id: sign-image
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          COSIGN_EXPERIMENTAL: false
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          DIGEST: ${{ steps.push-image.outputs.digest }}
        run: |
          # https://github.com/containers/container-libs/issues/388
          # use old bundle format, so we can use newer cosign 3.X.X instead of 2.X.X
          cosign sign -y --new-bundle-format=false --use-signing-config=false --key env://COSIGN_PRIVATE_KEY "${IMAGE_REGISTRY}/${IMAGE_NAME}@${DIGEST}"
