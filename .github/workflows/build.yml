---
name: Build container image
# Multi-image repo (toolbox images only): every top-level directory with a Containerfile is one image.
# The plan job picks the images to build (.github/scripts/plan-images.sh, tested by
# tests/plan-images.sh); build-image.yml builds, smoke-tests, publishes and signs one image.
#
# Branch model: pushes to `testing` publish the `testing*` tags; `main` is protected and only changes
# through a pull request from `testing`, whose merge publishes `latest*` (as do the weekly schedule,
# which runs on the default branch, and manual runs on main). Pull requests build and smoke-test
# only. No workflow-level `paths:` filter: with required status checks a skipped workflow leaves
# them pending forever, so the planning script does the filtering and the aggregate jobs below
# always report.
on:
  pull_request:
    branches:
      - main
  schedule:
    - cron: '0 6 * * 0'  # weekly, Sunday 06:00 UTC (the only schedule): all images
  push:
    branches:
      - main
      - testing
  workflow_dispatch:
    inputs:
      image:
        description: "Build only this image (directory or image name); empty builds all"
        type: string
        required: false
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    name: Plan builds
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      any: ${{ steps.plan.outputs.any }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0  # the plan diffs commit ranges

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 #v4.0.0

      - name: Lint and test the planning
        run: |
          just check
          just lint
          tests/plan-images.sh
          tests/new-image.sh

      - name: Choose images
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          AFTER: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          WANT: ${{ inputs.image }}
        run: |
          matrix=$(.github/scripts/plan-images.sh "${EVENT}" "${BEFORE}" "${AFTER}" "${WANT}")
          echo "matrix=${matrix}" >> "${GITHUB_OUTPUT}"
          echo "any=$(jq '.include | length > 0' <<<"${matrix}")" >> "${GITHUB_OUTPUT}"
          echo "Plan: ${matrix}"

  images:
    name: images (${{ matrix.image }})
    needs: plan
    if: needs.plan.outputs.any == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-image.yml
    with:
      image_name: ${{ matrix.image }}
      image_dir: ${{ matrix.dir }}
    secrets: inherit

  # The branch protection requires checks named "Build and push image" and "Sign and verify images".
  # Matrix and reusable workflow jobs get names of their own, so these two jobs keep the required
  # names. Signing happens inside build-image.yml (a matrix cannot pass outputs between jobs), so a
  # failure in either stage of any image fails the `images` job and therefore both aggregates. Both
  # pass when every planned image succeeded or when the plan was empty (nothing changed, or nothing
  # was published because this was a pull request).
  result:
    name: Build and push image
    needs: [plan, images]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every planned image built
        env:
          PLAN: ${{ needs.plan.result }}
          IMAGES: ${{ needs.images.result }}
        run: |
          echo "plan: ${PLAN}, images: ${IMAGES}"
          [[ "${PLAN}" == "success" ]] || { echo "::error::Planning failed"; exit 1; }
          [[ "${IMAGES}" == "success" || "${IMAGES}" == "skipped" ]] || { echo "::error::An image build failed or was cancelled"; exit 1; }

  signed:
    name: Sign and verify images
    needs: [plan, images]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every published image signed and verified (or nothing published)
        env:
          PLAN: ${{ needs.plan.result }}
          IMAGES: ${{ needs.images.result }}
        run: |
          echo "plan: ${PLAN}, images: ${IMAGES}"
          [[ "${PLAN}" == "success" ]] || { echo "::error::Planning failed"; exit 1; }
          [[ "${IMAGES}" == "success" || "${IMAGES}" == "skipped" ]] || { echo "::error::An image build, signing or verification failed or was cancelled"; exit 1; }
