---
name: Build container image
# Multi-image repo (toolbox images only): every top-level directory with a Containerfile is one image.
# The plan job picks the images to build (.github/scripts/plan-images.sh, tested by
# tests/plan-images.sh); build-image.yml builds, smoke-tests, publishes and signs one image.
#
# Branch model (GitLab Flow): a dev branch is checked by test.yml (fast, no image build); a merge into
# `testing` publishes the `testing*` tags; `main` is protected and only changes through a pull request from
# `testing`, whose merge promotes the tested image to `latest*` (as do the weekly schedule, which runs on the
# default branch, and manual runs on main). There is no pull_request trigger: the checks of a pull request
# from `testing` are the push run's, reported on the same commit. No workflow-level `paths:` filter: with
# required status checks a skipped workflow leaves them pending forever, so the planning script does the
# filtering and the aggregate jobs below always report.
on:
  schedule:
    - cron: '0 6 * * 0'  # weekly, Sunday 06:00 UTC (the only schedule): all images
  push:
    branches:
      - main
      - testing
  workflow_dispatch:
    inputs:
      image:
        description: "Build only this image (directory or image name); empty builds all"
        type: string
        required: false
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.event_name != 'schedule' }}

jobs:
  plan:
    name: Plan builds
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: read  # the promote decision looks up published testing tags
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      any: ${{ steps.plan.outputs.any }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0  # the plan diffs commit ranges

      - name: Choose images
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          WANT: ${{ inputs.image }}
          REF: ${{ github.ref }}
          PROMOTE_ENABLED: ${{ vars.PROMOTE_ENABLED }}
          IMAGE_REGISTRY: ghcr.io/${{ github.repository_owner }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          matrix=$(.github/scripts/plan-images.sh "${EVENT}" "${BEFORE}" "${AFTER}" "${WANT}")
          # Promote instead of rebuild? Only a merge to main of an already-tested testing image
          # (see promote-decision.sh); needs the repository variable PROMOTE_ENABLED=true.
          if [[ "${PROMOTE_ENABLED}" == "true" && "${EVENT}" == "push" && "${REF}" == "refs/heads/main" ]]; then
            skopeo login ghcr.io -u "${ACTOR}" --password-stdin <<<"${GH_TOKEN}" >/dev/null
          fi
          matrix=$(IMAGE_REGISTRY="${IMAGE_REGISTRY,,}" .github/scripts/plan-promote.sh "${matrix}" "${EVENT}" "${REF}")
          echo "matrix=${matrix}" >> "${GITHUB_OUTPUT}"
          echo "any=$(jq '.include | length > 0' <<<"${matrix}")" >> "${GITHUB_OUTPUT}"
          echo "Plan: ${matrix}"

  images:
    name: images (${{ matrix.image }})
    needs: plan
    if: needs.plan.outputs.any == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-image.yml
    with:
      image_name: ${{ matrix.image }}
      image_dir: ${{ matrix.dir }}
      mode: ${{ matrix.mode }}
      source: ${{ matrix.source }}
    secrets: inherit

  # The branch protection requires checks named "Build and push image" and "Sign and verify images".
  # Matrix and reusable workflow jobs get names of their own, so these two jobs keep the required
  # names. Building or promoting, and signing, happen inside build-image.yml (a matrix cannot pass outputs between jobs), so a
  # failure in either stage of any image fails the `images` job and therefore both aggregates. Both
  # pass when every planned image succeeded or when the plan was empty (nothing changed).
  result:
    name: Build and push image
    needs: [plan, images]
    if: always()
    runs-on: ubuntu-26.04
    steps:
      - name: Every planned image built
        env:
          PLAN: ${{ needs.plan.result }}
          IMAGES: ${{ needs.images.result }}
        run: |
          echo "plan: ${PLAN}, images: ${IMAGES}"
          [[ "${PLAN}" == "success" ]] || { echo "::error::Planning failed"; exit 1; }
          [[ "${IMAGES}" == "success" || "${IMAGES}" == "skipped" ]] || { echo "::error::An image build failed or was cancelled"; exit 1; }

  signed:
    name: Sign and verify images
    needs: [plan, images]
    if: always()
    runs-on: ubuntu-26.04
    steps:
      - name: Every published image signed and verified (or nothing published)
        env:
          PLAN: ${{ needs.plan.result }}
          IMAGES: ${{ needs.images.result }}
        run: |
          echo "plan: ${PLAN}, images: ${IMAGES}"
          [[ "${PLAN}" == "success" ]] || { echo "::error::Planning failed"; exit 1; }
          [[ "${IMAGES}" == "success" || "${IMAGES}" == "skipped" ]] || { echo "::error::An image build, signing or verification failed or was cancelled"; exit 1; }
