# Local builds (not published anywhere): the shipped contexts under build/<service>/ are built on the user's
# host by `dna-stack build` into localhost/dna-<service>:local; `dna-stack lock` skips them. Their base images
# are pinned by digest in each Containerfile (manifest lists resolved 2026-11-09, not signed upstream), and
# `dna-stack check` fails when a FROM lacks a digest. Bases:
