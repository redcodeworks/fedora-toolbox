# Generated by dna-stack (dna-toolbox). Do not edit; `dna-stack remove` deletes files with this header.
# The image has no shell and ENTRYPOINT /home/nonroot/lakekeeper, so the command is the argument
# (migrate, serve, healthcheck). Variables per the Lakekeeper docs (no _FILE variants exist). Not run here.
services:
  dna-lakekeeper-migrate:
    image: ${DNA_IMAGE_LAKEKEEPER}
    container_name: dna-lakekeeper-migrate
    restart: on-failure
    labels:
      dna-stack: "1"
    command: ["migrate"]
    env_file:
      - ${DNA_STATE}/env/lakekeeper.env
    networks: [dna]
    depends_on:
      dna-postgres:
        condition: service_healthy
  dna-lakekeeper:
    image: ${DNA_IMAGE_LAKEKEEPER}
    container_name: dna-lakekeeper
    restart: unless-stopped
    labels:
      dna-stack: "1"
    command: ["serve"]
    env_file:
      - ${DNA_STATE}/env/lakekeeper.env
    environment:
      LAKEKEEPER__SECRET_BACKEND: postgres
    healthcheck:
      test: ["CMD", "/home/nonroot/lakekeeper", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 12
    ports:
      - "127.0.0.1:${DNA_PORT_LAKEKEEPER}:8181"
    networks: [dna]
    depends_on:
      dna-lakekeeper-migrate:
        condition: service_completed_successfully
networks:
  dna:
    name: dna-stack
    labels:
      dna-stack: "1"
