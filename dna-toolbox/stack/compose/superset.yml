# Generated by dna-stack (dna-toolbox). Do not edit; `dna-stack remove` deletes files with this header.
# Superset from the local image dna-superset (built on this host by `dna-stack build`, `up` runs `compose up --build`), metadata in the shared Postgres. Add Trino as a database in
# the UI with the SQLAlchemy URI trino://<user>@dna-trino:8080/iceberg (hint, not run). UNVERIFIED: the config
# mount point /app/pythonpath and the init commands (`superset db upgrade`, `superset init`) are from memory.
services:
  dna-superset-init:
    image: ${DNA_IMAGE_SUPERSET}
    build: ${DNA_BUILD_SUPERSET}
    pull_policy: never
    container_name: dna-superset-init
    restart: on-failure
    labels:
      dna-stack: "1"
    command: ["sh", "-c", "superset db upgrade && superset init"]
    env_file:
      - ${DNA_STATE}/env/superset.env
    volumes:
      - ${DNA_STATE}/superset/superset_config.py:/app/pythonpath/superset_config.py:ro,z
    networks: [dna]
  dna-superset:
    image: ${DNA_IMAGE_SUPERSET}
    pull_policy: never
    container_name: dna-superset
    restart: unless-stopped
    labels:
      dna-stack: "1"
    env_file:
      - ${DNA_STATE}/env/superset.env
    ports:
      - "127.0.0.1:${DNA_PORT_SUPERSET}:8088"
    volumes:
      - ${DNA_STATE}/superset/superset_config.py:/app/pythonpath/superset_config.py:ro,z
    networks: [dna]
    depends_on:
      dna-superset-init:
        condition: service_completed_successfully
networks:
  dna:
    name: dna-stack
    labels:
      dna-stack: "1"
