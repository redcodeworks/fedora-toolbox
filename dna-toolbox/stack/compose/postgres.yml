# Generated by dna-stack (dna-toolbox). Do not edit; `dna-stack remove` deletes files with this header.
services:
  dna-postgres:
    image: ${DNA_IMAGE_POSTGRES}
    container_name: dna-postgres
    restart: unless-stopped
    labels:
      dna-stack: "1"
    env_file:
      - ${DNA_STATE}/env/postgres.env
    environment:
      POSTGRES_USER: dna
      POSTGRES_DB: lakekeeper
    ports:
      - "127.0.0.1:${DNA_PORT_POSTGRES}:5432"
    volumes:
      - dna-postgres-data:/var/lib/postgresql/data
    networks: [dna]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dna -d lakekeeper"]
      interval: 5s
      timeout: 3s
      retries: 20
networks:
  dna:
    name: dna-stack
    labels:
      dna-stack: "1"
volumes:
  dna-postgres-data:
    labels:
      dna-stack: "1"
