# Generated by dna-stack (dna-toolbox). Do not edit; `dna-stack remove` deletes files with this header.
# `mini` follows the Lakekeeper v0.13.1 example (SeaweedFS 4.36): master, volume, filer and S3 in one
# process, creating the bucket. The identity file is generated by setup (access key and secret, mode 600)
# and mounted read-only. UNVERIFIED: the flags were taken from that example and the docs, not run, and
# whether the image has wget for the healthcheck.
services:
  dna-seaweedfs:
    image: ${DNA_IMAGE_SEAWEEDFS}
    container_name: dna-seaweedfs
    restart: unless-stopped
    labels:
      dna-stack: "1"
    command: ["mini", "-dir=/data", "-bucket=${DNA_BUCKET:-dna-warehouse}", "-s3.config=/etc/seaweedfs/s3.json"]
    ports:
      - "127.0.0.1:${DNA_PORT_SEAWEEDFS_S3}:8333"
    volumes:
      - dna-seaweedfs-data:/data
      - ${DNA_STATE}/env/seaweedfs-s3.json:/etc/seaweedfs/s3.json:ro,z
    networks: [dna]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8333/status || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
networks:
  dna:
    name: dna-stack
    labels:
      dna-stack: "1"
volumes:
  dna-seaweedfs-data:
    labels:
      dna-stack: "1"
